<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 565" width="1200" height="565" role="img" aria-label="Four animated capability cards: AI engineering, software systems, cloud infrastructure, IoT and automation"><defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090F15"/><stop offset="1" stop-color="#111B22"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#77E4CC" stop-opacity="0"/><stop offset=".48" stop-color="#77E4CC" stop-opacity=".95"/><stop offset="1" stop-color="#77E4CC" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1D9A8B" stop-opacity=".25"/><stop offset="1" stop-color="#1D9A8B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#29414B" stroke-width=".55"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1198" height="563" rx="22"/></clipPath></defs><style>
 .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
 .spin{transform-origin:960px 270px;animation:spin 36s linear infinite}.spinfast{transform-origin:960px 270px;animation:spin 18s linear infinite reverse}
 .pulse{animation:pulse 3.4s ease-in-out infinite}.pulse2{animation:pulse 3.4s 1.7s ease-in-out infinite}
 .blink{animation:blink 1.3s steps(1) infinite}.scan{animation:scan 8s ease-in-out infinite alternate}
 .float{animation:float 4.5s ease-in-out infinite}.float2{animation:float 5.5s ease-in-out infinite reverse}
 .dash{stroke-dasharray:6 12;animation:dash 15s linear infinite}.dashfast{stroke-dasharray:3 12;animation:dash 7s linear infinite}
 .tracer{stroke-dasharray:22 450;animation:tracer 7s linear infinite}.sweep{animation:sweep 6s ease-in-out infinite alternate}
 .rise{animation:rise 1.7s ease-out both}
 .ticker{animation:slide 20s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.27}50%{opacity:1}}
 @keyframes blink{50%{opacity:0}}@keyframes scan{to{transform:translateX(240px)}}
 @keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-180}}
 @keyframes tracer{to{stroke-dashoffset:-472}}@keyframes sweep{to{transform:translateX(130px)}}
 @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
 @keyframes slide{to{transform:translateX(-490px)}}
 @media(prefers-reduced-motion:reduce){.spin,.spinfast,.pulse,.pulse2,.blink,.scan,.float,.float2,.dash,.dashfast,.tracer,.sweep,.rise,.ticker{animation:none!important}}
 </style>
 <rect x="1" y="1" width="1198" height="563" rx="22" fill="url(#bg)" stroke="#29414B" stroke-width="1.5"/>
 <g clip-path="url(#clip)"><rect x="0" y="0" width="1200" height="565" fill="url(#grid)" opacity=".46"/><text x="54" y="54" fill="#77E4CC" font-size="15" font-weight="700" class="mono" letter-spacing="2">01   //   CORE CAPABILITIES</text><g><rect x="50" y="84" width="539" height="207" rx="16" fill="#121D25" stroke="#29414B" stroke-width="1.5"/><rect x="50" y="84" width="5" height="207" fill="#77E4CC" opacity=".7"/><text x="77" y="121" fill="#77E4CC" font-size="16" font-weight="700" class="mono" >01</text><path d="M134 116L547 116" stroke="#29414B" stroke-width="1" opacity="0.9" fill="none"/><text x="78" y="176" fill="#ECF4F2" font-size="31" font-weight="700" class="sans" letter-spacing="-1">AI ENGINEERING</text><text x="79" y="229" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >Agents, LLM workflows</text><text x="79" y="259" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >and intelligent automation</text><circle cx="521" cy="216" r="35" fill="none" stroke="#77E4CC" stroke-opacity=".45" stroke-width="1.5" class="pulse"/><path d="M502 216h38m-19-19v38" stroke="#77E4CC" stroke-width="2" opacity=".7"/></g><g><rect x="610" y="84" width="539" height="207" rx="16" fill="#121D25" stroke="#29414B" stroke-width="1.5"/><rect x="610" y="84" width="5" height="207" fill="#77E4CC" opacity=".7"/><text x="637" y="121" fill="#77E4CC" font-size="16" font-weight="700" class="mono" >02</text><path d="M694 116L1107 116" stroke="#29414B" stroke-width="1" opacity="0.9" fill="none"/><text x="638" y="176" fill="#ECF4F2" font-size="31" font-weight="700" class="sans" letter-spacing="-1">SOFTWARE SYSTEMS</text><text x="639" y="229" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >Web platforms, APIs</text><text x="639" y="259" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >and robust backend services</text><circle cx="1081" cy="216" r="35" fill="none" stroke="#77E4CC" stroke-opacity=".45" stroke-width="1.5" class="pulse"/><path d="M1062 216h38m-19-19v38" stroke="#77E4CC" stroke-width="2" opacity=".7"/></g><g><rect x="50" y="320" width="539" height="207" rx="16" fill="#121D25" stroke="#29414B" stroke-width="1.5"/><rect x="50" y="320" width="5" height="207" fill="#77E4CC" opacity=".7"/><text x="77" y="357" fill="#77E4CC" font-size="16" font-weight="700" class="mono" >03</text><path d="M134 352L547 352" stroke="#29414B" stroke-width="1" opacity="0.9" fill="none"/><text x="78" y="412" fill="#ECF4F2" font-size="31" font-weight="700" class="sans" letter-spacing="-1">CLOUD &amp; INFRA</text><text x="79" y="465" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >Deployment, integration</text><text x="79" y="495" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >and connected architecture</text><circle cx="521" cy="452" r="35" fill="none" stroke="#77E4CC" stroke-opacity=".45" stroke-width="1.5" class="pulse"/><path d="M502 452h38m-19-19v38" stroke="#77E4CC" stroke-width="2" opacity=".7"/></g><g><rect x="610" y="320" width="539" height="207" rx="16" fill="#121D25" stroke="#29414B" stroke-width="1.5"/><rect x="610" y="320" width="5" height="207" fill="#77E4CC" opacity=".7"/><text x="637" y="357" fill="#77E4CC" font-size="16" font-weight="700" class="mono" >04</text><path d="M694 352L1107 352" stroke="#29414B" stroke-width="1" opacity="0.9" fill="none"/><text x="638" y="412" fill="#ECF4F2" font-size="31" font-weight="700" class="sans" letter-spacing="-1">IoT &amp; AUTOMATION</text><text x="639" y="465" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >Embedded interfaces</text><text x="639" y="495" fill="#92AAA9" font-size="19" font-weight="400" class="sans" >and real-world telemetry</text><circle cx="1081" cy="452" r="35" fill="none" stroke="#77E4CC" stroke-opacity=".45" stroke-width="1.5" class="pulse"/><path d="M1062 452h38m-19-19v38" stroke="#77E4CC" stroke-width="2" opacity=".7"/></g></g></svg>