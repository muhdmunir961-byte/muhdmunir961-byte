<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="focus Founder HUD"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1016"/><stop offset="1" stop-color="#15212A"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:monospace}.spin{animation:rot 28s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:flow 8s linear infinite}.blink{animation:blink 1.3s steps(1) infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.spin,.pulse,.dash,.blink{animation:none!important}}</style><rect x="1" y="1" width="1198" height="418" rx="22" fill="url(#bg)" stroke="#32505A" stroke-width="1.5"/><text x="44" y="52" class="m" font-size="15" font-weight="700" fill="#7FE6CA">SKILL TREE / FOUR ACTIVE BRANCHES</text><text x="44" y="95" class="s" font-size="32" font-weight="800" fill="#F2F3EF">The work spans four connected disciplines.</text><path d="M202 230H388" stroke="#7FE6CA" stroke-width="3" class="dash"/><circle cx="150" cy="230" r="54" fill="#131D24" stroke="#7FE6CA" stroke-width="2"/><text x="150" y="239" text-anchor="middle" class="m" font-size="23" font-weight="700" fill="#F2F3EF">AI</text><rect x="43" y="312" width="214" height="54" rx="12" fill="#131D24" stroke="#32505A"/><text x="150" y="346" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#F2F3EF">Applied AI</text><path d="M492 230H678" stroke="#7FE6CA" stroke-width="3" class="dash"/><circle cx="440" cy="230" r="54" fill="#131D24" stroke="#7FE6CA" stroke-width="2"/><text x="440" y="239" text-anchor="middle" class="m" font-size="23" font-weight="700" fill="#F2F3EF">APP</text><rect x="333" y="312" width="214" height="54" rx="12" fill="#131D24" stroke="#32505A"