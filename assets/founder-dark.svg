<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 438" width="1200" height="438" role="img" aria-label="Co-Founder at AWA Teknologi Indonesia — technology across Malaysia and Indonesia"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091016"/><stop offset="1" stop-color="#132027"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#34515A" stroke-width=".65" opacity=".5"/></pattern><clipPath id="clip"><rect x="1" y="1" width="1198" height="436" rx="20"/></clipPath></defs><style>
.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.ser{font-family:Georgia,'Times New Roman',serif}
.k{animation:rotate 34s linear infinite;transform-box:fill-box;transform-origin:center}.k2{animation:rotate 17s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.b{animation:breathe 3.4s ease-in-out infinite}.b2{animation:breathe 3.4s ease-in-out 1.7s infinite}
.float{animation:float 5.4s ease-in-out infinite}.scan{animation:slide 7s ease-in-out infinite alternate}
.dash{stroke-dasharray:7 14;animation:dash 7s linear infinite}.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 3s ease-out forwards}
.rise{animation:rise 1.3s ease-out both}.r2{animation:rise 1.3s .3s ease-out both}.cursor{animation:blink 1.3s steps(1) infinite}
@keyframes rotate{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes slide{to{transform:translateX(240px)}}
@keyframes dash{to{stroke-dashoffset:-126}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.k,.k2,.b,.b2,.float,.scan,.dash,.draw,.rise,.r2,.cursor{animation:none!important}.draw{stroke-dashoffset:0}}
</style><rect x="1" y="1" width="1198" height="436" rx="20" fill="url(#bg)" stroke="#34515A" stroke-width="1.5"/><g clip-path="url(#clip)"><rect width="1200" height="438" fill="url(#grid)" opacity=".45"/>
 <rect x="66" y="58" width="205" height="40" rx="20" fill="#1D3439" stroke="#87E4C9" stroke-opacity=".7"/>
 <circle cx="90" cy="78" r="5" fill="#87E4C9" class="b"/><text x="111" y="85" class="m" font-size="16" font-weight="700" fill="#87E4C9">CO-FOUNDER</text>
 <text x="60" y="209" class="s" font-size="116" font-weight="900" letter-spacing="-5" fill="#F4F4EF">AWA<tspan fill="#87E4C9">.</tspan></text>
 <text x="66" y="261" class="m" font-size="36" font-weight="700" letter-spacing="2" fill="#F4F4EF">TEKNOLOGI INDONESIA</text>
 <path d="M65 291H686" stroke="#34515A" stroke-width="2"/>
 <text x="66" y="330" class="s" font-size="19" fill="#ACC2C1">Bridging engineering, AI and purposeful digital products.</text>
 <text x="66" y="378" class="m" letter-spacing="2.5" font-size="14" fill="#E7AF75">FOUNDER MINDSET  /  ENGINEERING DISCIPLINE</text>
 <g transform="translate(980 215)">
  <path d="M-185 0H185M0-180V180" stroke="#34515A"/>
  <circle r="176" fill="none" stroke="#34515A" stroke-dasharray="3 8"/>
  <circle r="133" fill="none" stroke="#34515A"/>
  <circle r="89" fill="none" stroke="#87E4C9" opacity=".6"/>
  <g class="k"><circle r="160" fill="none" stroke="#87E4C9" stroke-width="5" stroke-dasharray="55 950"/><circle cx="160" cy="0" r="6" fill="#87E4C9"/></g>
  <g class="k2"><circle r="116" fill="none" stroke="#E7AF75" stroke-width="2" stroke-dasharray="18 24"/></g>
  <circle r="43" fill="#142229" stroke="#87E4C9"/>
  <path d="M-19 18L0-20L19 18M-11 4H11" fill="none" stroke="#87E4C9" stroke-width="5" stroke-linecap="round"/>
 </g>
