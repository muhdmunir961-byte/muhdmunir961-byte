<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 438" width="1200" height="438" role="img" aria-label="AWA Teknologi Indonesia co-founder command-center visual"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0A1016"/><stop offset="1" stop-color="#15212A"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.b{animation:beacon 3s ease-in-out infinite}.b2{animation:beacon 3s ease-in-out 1.5s infinite}.rot{animation:rotation 26s linear infinite;transform-box:fill-box;transform-origin:center}.trail{stroke-dasharray:9 15;animation:flow 7s linear infinite}.blink{animation:beacon 1.6s step-end infinite}.sweep{animation:sweep 5s ease-in-out infinite alternate}.reveal{stroke-dasharray:500;stroke-dashoffset:500;animation:reveal 2.7s ease-out forwards}@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes rotation{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes sweep{to{transform:translateX(210px)}}@keyframes reveal{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.b,.b2,.rot,.trail,.blink,.sweep,.reveal{animation:none!important}.reveal{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="436" rx="18" fill="url(#g)" stroke="#34515A" stroke-width="2"/><rect x="54" y="42" width="226" height="46" rx="20" fill="#1B3137" stroke="#7FE6CA" stroke-opacity=".75" stroke-width="2"/><circle cx="85" cy="65" r="7" fill="#7FE6CA" class="b"/><text x="105" y="74" class="m" font-size="21" font-weight="700" fill="#7FE6CA">CO-FOUNDER</text><text x="54" y="209" class="s" font-size="132" letter-spacing="-7" font-weight="900" fill="#F2F3EF">AWA<tspan fill="#7FE6CA">.</tspan></text><text x="59" y="270" class="m" font-size="42" font-weight="700" fill="#F2F3EF">TEKNOLOGI INDONESIA</text><path d="M61 301H720" stroke="#34515A" stroke-width="2"/><text x="61" y="343" class="s" font-size="23" fill="#B4C6C3">Software architecture. AI. Product engineering.</text><text x="60" y="398" class="m" font-size="18" font-weight="700" letter-spacing="1.2" fill="#E7B171">FOUNDER / ENGINEER / BUILDER</text><g transform="translate(980 219)"><circle r="182" fill="none" stroke="#34515A" stroke-width="2"/><circle r="146" fill="none" stroke="#34515A"/><circle r="106" fill="none" stroke="#34515A"/><g class="rot"><circle r="164" fill="none" stroke="#7FE6CA" stroke-width="5" stroke-dasharray="68 963"/><circle cx="164" cy="0" r="7" fill="#7FE6CA"/></g><path d="M-164 0H164M0-164V164" stroke="#34515A" stroke-width="2" opacity=".6"/><circle r="46" fill="#1B3137" stroke="#7FE6CA" stroke-width="3"/><text x="0" y="13" text-anchor="middle" class="s" font-size="43" font-weight="900" fill="#F2F3EF">A</text></g></svg>