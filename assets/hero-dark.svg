<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Muhd Munir — Founder HUD hero"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1016"/><stop offset="1" stop-color="#15212A"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#32505A" opacity=".45" stroke-width=".6"/></pattern></defs><style>
.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.b{animation:breathe 3.2s ease-in-out infinite}.b2{animation:breathe 3.2s ease-in-out 1.6s infinite}.spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}.spin2{animation:spin 18s linear infinite reverse;transform-box:fill-box;transform-origin:center}.dash{stroke-dasharray:8 14;animation:dash 8s linear infinite}.scan{animation:scan 6s ease-in-out infinite alternate}.cursor{animation:blink 1.3s step-end infinite}.float{animation:float 5s ease-in-out infinite}.line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.7s ease-out forwards}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-132}}@keyframes scan{to{transform:translateX(220px)}}@keyframes blink{50%{opacity:0}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.b,.b2,.spin,.spin2,.dash,.scan,.cursor,.float,.line{animation:none!important}.line{stroke-dashoffset:0}}
</style><rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#bg)" stroke="#32505A" stroke-width="1.5"/><rect x="0" y="0" width="1200" height="560" fill="url(#grid)" opacity=".36"/>
