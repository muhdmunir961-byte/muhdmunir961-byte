344" y="130" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">RESEARCH</text><circle cx="577" cy="192" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="577" cy="192" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse2"/><text x="577" y="197" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">DESIGN</text><circle cx="811" cy="125" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="811" cy="125" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse"/><text x="811" y="130" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">BUILD</text><circle cx="1054" cy="169" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="1054" cy="169" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse2"/><text x="1054" y="174" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">TEST</text><circle cx="853" cy="329" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="853" cy="329" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse"/><text x="853" y="334" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">ITERATE</text><circle cx="584" cy="355" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="584" cy="355" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse2"/><text x="584" y="360" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">SHIP</text><circle cx="307" cy="330" r="43" fill="#FFFFFF" stroke="#168D7D" stroke-opacity=".54" stroke-width="1.8"/><circle cx="307" cy="330" r="50" fill="none" stroke="#168D7D" stroke-opacity=".15" class="pulse"/><text x="307" y="335" text-anchor="middle" fill="#172B30" font-size="15" font-weight="700" class="mono">LEARN</text><text x="62" y="444" fill="#567277" font-size="15" font-weight="700" class="mono" letter-spacing="1.3">PROGRESS IS A LOOP, NOT A STRAIGHT LINE.</text></g></svg>