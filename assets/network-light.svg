<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 446" width="1200" height="446" role="img" aria-label="Engineering process — discover, architect, build, validate and iterate"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8F6F0"/><stop offset="1" stop-color="#EDEFE9"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.k{animation:rotate 27s linear infinite;transform-origin:center;transform-box:fill-box}.dash{stroke-dasharray:7 14;animation:dash 7s linear infinite}.draw{stroke-dasharray:430;stroke-dashoffset:430;animation:draw 3s ease-out forwards}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-126}}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.k,.dash,.draw{animation:none!important}.draw{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="444" rx="20" fill="url(#bg)" stroke="#CCD9D4" stroke-width="1.5"/>
