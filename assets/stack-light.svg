<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Animated five-row technology stack: languages, frontend, backend, platform and embedded systems"><defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5F6F1"/><stop offset="1" stop-color="#ECF2EE"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#168D7D" stop-opacity="0"/><stop offset=".48" stop-color="#168D7D" stop-opacity=".95"/><stop offset="1" stop-color="#168D7D" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#9FE2CE" stop-opacity=".25"/><stop offset="1" stop-color="#9FE2CE" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#C5D6D2" stroke-width=".55"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1198" height="598" rx="22"/></clipPath></defs><style>
 .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
 .spin{transform-origin:960px 270px;animation:spin 36s linear infinite}.spinfast{transform-origin:960px 270px;animation:spin 18s linear infinite reverse}
 .pulse{animation:pulse 3.4s ease-in-out infinite}.pulse2{animation:pulse 3.4s 1.7s ease-in-out infinite}
 .blink{animation:blink 1.3s steps(1) infinite}.scan{animation:scan 8s ease-in-out infinite alternate}
 .float{animation:float 4.5s ease-in-out infinite}.float2{animation:float 5.5s ease-in-out infinite reverse}
 .dash{stroke-dasharray:6 12;animation:dash 15s linear infinite}.dashfast{stroke-dasharray:3 12;animation:dash 7s linear infinite}
 .tracer{stroke-dasharray:22 450;animation:tracer 7s linear infinite}.sweep{animation:sweep 6s ease-in-out infinite alternate}
 .rise{animation:rise 1.7s ease-out both}
 .ticker{animation:slide 20s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.27}50%{opacity:1}}
 @keyframes blink{50%{opacity:0}}@keyframes scan{to{transform:translateX(240px)}}
 @keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-180}}
 @keyframes tracer{to{stroke-dashoffset:-472}}@keyframes sweep{to{transform:translateX(130px)}}
 @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
 @keyframes slide{to{transform:translateX(-490px)}}
 @media(prefers-reduced-motion:reduce){.spin,.spinfast,.pulse,.pulse2,.blink,.scan,.float,.float2,.dash,.dashfast,.tracer,.sweep,.rise,.ticker{animation:none!important}}
 </style>
 <rect x="1" y="1" width="1198" height="598" rx="22" fill="url(#bg)" stroke="#C5D6D2" stroke-width="1.5"/>
 <g clip-path="url(#clip)"><rect x="0" y="0" width="1200" height="600" fill="url(#grid)" opacity=".46"/><text x="52" y="58" fill="#168D7D" font-size="15" font-weight="700" class="mono" letter-spacing="2">02  //  TECHNICAL LANDSCAPE</text><rect x="50" y="103" width="1098" height="79" rx="10" fill="#FFFFFF" stroke="#C5D6D2" stroke-width="1"/><rect x="50" y="103" width="5" height="79" fill="#168D7D" opacity="0.95"/><text x="76" y="136" fill="#168D7D" font-size="16" font-weight="700" class="mono" letter-spacing="1.4">LANGUAGES</text><text x="300" y="152" fill="#172B30" font-size="25" font-weight="500" class="mono" >TypeScript   JavaScript   Python   C++</text><circle cx="1116" cy="143" r="8" fill="#168D7D" opacity=".35" class="pulse2"/><rect x="50" y="197" width="1098" height="79" rx="10" fill="#E1F2E9" stroke="#C5D6D2" stroke-width="1"/><rect x="50" y="197" width="5" height="79" fill="#168D7D" opacity="0.8099999999999999"/><text x="76" y="230" fill="#168D7D" font-size="16" font-weight="700" class="mono" letter-spacing="1.4">FRONTEND</text><text x="300" y="246" fill="#172B30" font-size="25" font-weight="500" class="mono" >React   Next.js   HTML   CSS   Tailwind</text><circle cx="1116" cy="237" r="8" fill="#168D7D" opacity=".8" class="pulse"/><rect x="50" y="291" width="1098" height="79" rx="10" fill="#FFFFFF" stroke="#C5D6D2" stroke-width="1"/><rect x="50" y="291" width="5" height="79" fill="#168D7D" opacity="0.6699999999999999"/><text x="76" y="324" fill="#168D7D" font-size="16" font-weight="700" class="mono" letter-spacing="1.4">BACKEND</text><text x="300" y="340" fill="#172B30" font-size="25" font-weight="500" class="mono" >Node.js   Fastify   Prisma   PostgreSQL</text><circle cx="1116" cy="331" r="8" fill="#168D7D" opacity=".35" class="pulse2"/><rect x="50" y="385" width="1098" height="79" rx="10" fill="#E1F2E9" stroke="#C5D6D2" stroke-width="1"/><rect x="50" y="385" width="5" height="79" fill="#168D7D" opacity="0.5299999999999999"/><text x="76" y="418" fill="#168D7D" font-size="16" font-weight="700" class="mono" letter-spacing="1.4">PLATFORM</text><text x="300" y="434" fill="#172B30" font-size="25" font-weight="500" class="mono" >GitHub   Cloudflare   Coolify   WebSocket</text><circle cx="1116" cy="425" r="8" fill="#168D7D" opacity=".35" class="pulse"/><rect x="50" y="479" width="1098" height="79" rx="10" fill="#FFFFFF" stroke="#C5D6D2" stroke-width="1"/><rect x="50" y="479" width="5" height="79" fill="#168D7D" opacity="0.3899999999999999"/><text x="76" y="512" fill="#168D7D" font-size="16" font-weight="700" class="mono" letter-spacing="1.4">SYSTEMS</text><text x="300" y="528" fill="#172B30" font-size="25" font-weight="500" class="mono" >ESP32   Arduino   Integrations   APIs</text><circle cx="1116" cy="519" r="8" fill="#168D7D" opacity=".35" class="pulse2"/><rect x="49" y="570" width="330" height="4" rx="2" fill="#C5D6D2"/><rect x="49" y="570" width="86" height="4" rx="2" fill="#168D7D" class="scan"/></g></svg>