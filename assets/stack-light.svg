"#CCD9D4"/><text x="685" y="240" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">LLM APIs</text><rect x="446" y="275" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="521" y="307" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">Agents</text><rect x="610" y="275" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="685" y="307" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">Workflows</text><rect x="812" y="110" width="355" height="252" rx="17" fill="#FFFFFF" stroke="#CCD9D4" stroke-width="1.5"/><path d="M832 162H1147" stroke="#CCD9D4"/><circle cx="837" cy="137" r="6" fill="#167B70" class="b"/><text x="856" y="145" class="m" font-size="19" font-weight="700" fill="#17292A">INFRASTRUCTURE</text><text x="832" y="190" class="m" font-size="14" fill="#516563">BUILD &amp; OPERATE</text><rect x="832" y="208" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="907" y="240" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">Node.js</text><rect x="996" y="208" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="1071" y="240" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">PostgreSQL</text><rect x="832" y="275" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="907" y="307" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">Cloudflare</text><rect x="996" y="275" width="151" height="52" rx="11" fill="#E0EEE9" stroke="#CCD9D4"/><text x="1071" y="307" text-anchor="middle" class="s" font-size="18" font-weight="700" fill="#17292A">ESP32</text>
