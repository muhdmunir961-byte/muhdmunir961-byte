<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 398" width="1200" height="398" role="img" aria-label="stack Founder HUD"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F5EF"/><stop offset="1" stop-color="#EAF0EC"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:monospace}.spin{animation:rot 28s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:flow 8s linear infinite}.blink{animation:blink 1.3s steps(1) infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.spin,.pulse,.dash,.blink{animation:none!important}}</style><rect x="1" y="1" width="1198" height="396" rx="22" fill="url(#bg)" stroke="#C8D7D1" stroke-width="1.5"/><text x="42" y="49" class="m" font-size="15" font-weight="700" fill="#167E73">LOADOUT / CURRENT TOOLKIT</text><text x="42" y="90" class="s" font-size="31" font-weight="800" fill="#172529">Tools are chosen for the job, not for the hype.</text><rect x="40" y="118" width="354" height="242" rx="16" fill="#FFFFFF" stroke="#C8D7D1"/><text x="63" y="152" class="m" font-size="19" font-weight="700" fill="#172529">INTERFACES</text><text x="63" y="177" class="m" font-size="12" font-weight="400" fill="#556769">React / Next.js / TypeScript / Tailwind</text><rect x="60" y="214" width="144" height="48" rx="10" fill="#EAF0EC" stroke="#C8D7D1"/><text x="132" y="244" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#172529">React</text><rect x="218" y="214" width="144" height="48" rx="10" fill="#EAF0EC" stroke="#C8D7D1"/><text x="290" y="244" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#172529">Next.js</text><rect x="60" y="282" width="144" height="48" rx="10" fill="#EAF0EC" stroke="#C8D7D1"/><text x="132" y="312" text