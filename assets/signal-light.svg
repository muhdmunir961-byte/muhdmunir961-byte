<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 106" width="1200" height="106" role="img" aria-label="Animated command strip showing research, design, engineering, automation and deployment"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#F7F5EF"/><stop offset="1" stop-color="#EAF0EC"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.b{animation:beacon 3s ease-in-out infinite}.b2{animation:beacon 3s ease-in-out 1.5s infinite}.rot{animation:rotation 26s linear infinite;transform-box:fill-box;transform-origin:center}.trail{stroke-dasharray:9 15;animation:flow 7s linear infinite}.blink{animation:beacon 1.6s step-end infinite}.sweep{animation:sweep 5s ease-in-out infinite alternate}.reveal{stroke-dasharray:500;stroke-dashoffset:500;animation:reveal 2.7s ease-out forwards}@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes rotation{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes sweep{to{transform:translateX(210px)}}@keyframes reveal{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.b,.b2,.rot,.trail,.blink,.sweep,.reveal{animation:none!important}.reveal{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="104" rx="18" fill="url(#g)" stroke="#C8D7D1" stroke-width="2"/><path d="M28 78H1174" stroke="#C8D7D1" stroke-width="2"/><path class="reveal" d="M28 78H528" stroke="#167E73" stroke-width="4"/><rect x="36" y="25" width="24" height="24" rx="5" fill="#167E73"/><text x="74" y="49" class="m" font-size="23" font-weight="700" fill="#172529">RESEARCH</text><circle cx="255" cy="39" r="6" fill="#AA6733" class="b"/><text x="277" y="49" class="m" font-size="23" font-weight="700" fill="#172529">DESIGN</text><circle cx="431" cy="39" r="6" fill="#AA6733" class="b2"/><text x="457" y="49" class="m" font-size="23" font-weight="700" fill="#172529">ENGINEER</text><circle cx="647" cy="39" r="6" fill="#AA6733" class="b"/><text x="670" y="49" class="m" font-size="23" font-weight="700" fill="#172529">AUTOMATE</text><circle cx="869" cy="39" r="6" fill="#AA6733" class="b2"/><text x="894" y="49" class="m" font-size="23" font-weight="700" fill="#172529">DEPLOY</text><circle cx="1058" cy="39" r="6" fill="#AA6733" class="b"/><text x="1075" y="49" class="m" font-size="23" font-weight="700" fill="#172529">SHIP</text></svg>