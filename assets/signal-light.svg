<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="Animated visual statement: Research, Design, Systems, Applied AI, Build, Ship"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8F6F0"/><stop offset="1" stop-color="#EDEFE9"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CCD9D4" stroke-width=".65" opacity=".5"/></pattern><clipPath id="clip"><rect x="1" y="1" width="1198" height="102" rx="20"/></clipPath></defs><style>
.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.ser{font-family:Georgia,'Times New Roman',serif}
.k{animation:rotate 34s linear infinite;transform-box:fill-box;transform-origin:center}.k2{animation:rotate 17s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.b{animation:breathe 3.4s ease-in-out infinite}.b2{animation:breathe 3.4s ease-in-out 1.7s infinite}
.float{animation:float 5.4s ease-in-out infinite}.scan{animation:slide 7s ease-in-out infinite alternate}
.dash{stroke-dasharray:7 14;animation:dash 7s linear infinite}.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 3s ease-out forwards}
.rise{animation:rise 1.3s ease-out both}.r2{animation:rise 1.3s .3s ease-out both}.cursor{animation:blink 1.3s steps(1) infinite}
@keyframes rotate{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes slide{to{transform:translateX(240px)}}
@keyframes dash{to{stroke-dashoffset:-126}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.k,.k2,.b,.b2,.float,.scan,.dash,.draw,.rise,.r2,.cursor{animation:none!important}.draw{stroke-dashoffset:0}}
</style><rect x="1" y="1" width="1198" height="102" rx="20" fill="url(#bg)" stroke="#CCD9D4" stroke-width="1.5"/><g clip-path="url(#clip)">
 <g class="float"><rect x="43" y="36" width="28" height="28" rx="8" fill="#167B70"/><path d="M53 50H61 M57 46V54" stroke="#F8F6F0" stroke-width="2"/></g>
 <text x="89" y="59" class="m" font-size="19" font-weight="700" letter-spacing="1.3" fill="#17292A">RESEARCH</text>
 <circle cx="248" cy="52" r="4" fill="#AA6531" class="b"/>
 <text x="267" y="59" class="m" font-size="19" font-weight="700" letter-spacing="1.3" fill="#17292A">DESIGN</text>
 <circle cx="413" cy="52" r="4" fill="#AA6531" class="b2"/>
 <text x="434" y="59" class="m" font-size="19" font-weight="700" letter-spacing="1.3" fill="#17292A">ENGINEER</text>
 <circle cx="621" cy="52" r="4" fill="#AA6531" class="b"/>
 <text x="643" y="59" class="m" font-size="19" font-weight="700" letter-spacing="1.3" fill="#17292A">INTELLIGENCE</text>
 <circle cx="849" cy="52" r="4" fill="#AA6531" class="b2"/>
 <text x="869" y="59" class="m" font-size="19" font-weight="700" letter-spacing="1.3" fill="#17292A">DEPLOY</text>
