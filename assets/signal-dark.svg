<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="signal Founder HUD"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1016"/><stop offset="1" stop-color="#15212A"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:monospace}.spin{animation:rot 28s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:flow 8s linear infinite}.blink{animation:blink 1.3s steps(1) infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.spin,.pulse,.dash,.blink{animation:none!important}}</style><rect x="1" y="1" width="1198" height="106" rx="22" fill="url(#bg)" stroke="#32505A" stroke-width="1.5"/><text x="40" y="63" class="m" font-size="18" font-weight="700" fill="#7FE6CA">MISSION SET:</text><text x="212" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">RESEARCH</text><circle cx="318" cy="56" r="4" fill="#E7B171" class="pulse"/><text x="348" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">DESIGN</text><circle cx="430" cy="56" r="4" fill="#E7B171" class="pulse"/><text x="468" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">ENGINEER</text><circle cx="574" cy="56" r="4" fill="#E7B171" class="pulse"/><text x="637" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">AUTOMATE</text><circle cx="743" cy="56" r="4" fill="#E7B171" class="pulse"/><text x="807" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">DEPLOY</text><circle cx="889" cy="56" r="4" fill="#E7B171" class="pulse"/><text x="955" y="63" class="m" font-size="18" font-weight="700" fill="#F2F3EF">EVOLVE</text></svg>