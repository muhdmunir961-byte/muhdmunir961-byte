<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="signal animated Founder HUD"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1016"/><stop offset="1" stop-color="#131D24"/></linearGradient></defs><style>.mono{font-family:'Courier New',monospace}.sans{font-family:Arial,Helvetica,sans-serif}.orbit{animation:rot 24s linear infinite;transform-origin:center;transform-box:fill-box}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 13;animation:flow 7s linear infinite}.cursor{animation:blink 1.2s steps(1) infinite}.draw{stroke-dasharray:410;stroke-dashoffset:410;animation:draw 3s ease-out forwards}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.25}}@keyframes flow{to{stroke-dashoffset:-126}}@keyframes blink{50%{opacity:0}}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.flow,.cursor,.draw{animation:none!important}.draw{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="110" rx="20" fill="url(#bg)" stroke="#32505A" stroke-width="2"/><rect x="20" y="20" width="1160" height="72" rx="14" fill="#131D24" stroke="#32505A"/><text x="45" y="66" class="mono" font-size="19" fill="#7FE6CA" >MISSION SET:</text><text x="235" y="66" class="mono" font-size="17" fill="#F2F3EF" >RESEARCH</text><circle cx="217" cy="59" r="4" fill="#E7B171" class="pulse"/><text x="386" y="66" class="mono" font-size="17" fill="#F2F3EF" >DESIGN</text><circle cx="368" cy="59" r="4" fill="#E7B171" class="pulse"/><text x="537" y="66" class="mono" font-size="17" fill="#F2F3EF" >ENGINEER</text><circle cx="519" cy="59" r="4" fill="#E7B171" class="pulse"/><text x="688" y="66" class="mono" font-size="17" fill="#F2F3EF" >AUTOMATE</text><circle cx="670" cy="59" r="4" fill="#E7B171" class="pulse"/><text x="839" y="66" class="mono" font-size="17" fill="#F2F3EF" >DEPLOY</text><circle cx="821" cy="59" r="4" fill="#E7B171" class="pulse"/><text x="990" y="66" class="mono" font-size="17" fill="#F2F3EF" >EVOLVE</text><circle cx="972" cy="59" r="4" fill="#E7B171" class="pulse"/></svg>