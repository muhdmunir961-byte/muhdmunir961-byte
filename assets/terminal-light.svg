<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Animated code editor identity introducing Muhd Munir as co-founder, software engineer and AI engineer"><defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5F6F1"/><stop offset="1" stop-color="#ECF2EE"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#168D7D" stop-opacity="0"/><stop offset=".48" stop-color="#168D7D" stop-opacity=".95"/><stop offset="1" stop-color="#168D7D" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#9FE2CE" stop-opacity=".25"/><stop offset="1" stop-color="#9FE2CE" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#C5D6D2" stroke-width=".55"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1198" height="478" rx="22"/></clipPath></defs><style>
 .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
 .spin{transform-origin:960px 270px;animation:spin 36s linear infinite}.spinfast{transform-origin:960px 270px;animation:spin 18s linear infinite reverse}
 .pulse{animation:pulse 3.4s ease-in-out infinite}.pulse2{animation:pulse 3.4s 1.7s ease-in-out infinite}
 .blink{animation:blink 1.3s steps(1) infinite}.scan{animation:scan 8s ease-in-out infinite alternate}
 .float{animation:float 4.5s ease-in-out infinite}.float2{animation:float 5.5s ease-in-out infinite reverse}
 .dash{stroke-dasharray:6 12;animation:dash 15s linear infinite}.dashfast{stroke-dasharray:3 12;animation:dash 7s linear infinite}
 .tracer{stroke-dasharray:22 450;animation:tracer 7s linear infinite}.sweep{animation:sweep 6s ease-in-out infinite alternate}
 .rise{animation:rise 1.7s ease-out both}
 .ticker{animation:slide 20s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.27}50%{opacity:1}}
 @keyframes blink{50%{opacity:0}}@keyframes scan{to{transform:translateX(240px)}}
 @keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-180}}
 @keyframes tracer{to{stroke-dashoffset:-472}}@keyframes sweep{to{transform:translateX(130px)}}
 @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
 @keyframes slide{to{transform:translateX(-490px)}}
 @media(prefers-reduced-motion:reduce){.spin,.spinfast,.pulse,.pulse2,.blink,.scan,.float,.float2,.dash,.dashfast,.tracer,.sweep,.rise,.ticker{animation:none!important}}
 </style>
 <rect x="1" y="1" width="1198" height="478" rx="22" fill="url(#bg)" stroke="#C5D6D2" stroke-width="1.5"/>
 <g clip-path="url(#clip)"><rect x="0" y="0" width="1200" height="480" fill="url(#grid)" opacity=".46"/><rect x="48" y="44" width="1104" height="396" rx="15" fill="#FFFFFF" stroke="#C5D6D2" stroke-width="2"/><path d="M49 99H1151" stroke="#C5D6D2"/><circle cx="83" cy="71" r="6" fill="#168D7D" opacity=".7"/><circle cx="106" cy="71" r="6" fill="#419967" opacity=".7"/><circle cx="129" cy="71" r="6" fill="#567277" opacity=".35"/><text x="466" y="77" fill="#567277" font-size="15" font-weight="400" class="mono" >identity.ts — active session</text><text x="90" y="148" fill="#168D7D" font-size="23" font-weight="700" class="mono" >&gt; whoami</text><text x="92" y="189" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >01</text><text x="156" y="189" fill="#172B30" font-size="18" font-weight="400" class="mono" >const engineer = {</text><text x="92" y="214" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >02</text><text x="156" y="214" fill="#567277" font-size="18" font-weight="400" class="mono" >  name: &quot;Muhd Munir&quot;,</text><text x="92" y="239" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >03</text><text x="156" y="239" fill="#567277" font-size="18" font-weight="400" class="mono" >  role: [&quot;Software Engineer&quot;, &quot;AI Engineer&quot;],</text><text x="92" y="264" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >04</text><text x="156" y="264" fill="#567277" font-size="18" font-weight="400" class="mono" >  company: &quot;AWA Teknologi Indonesia&quot;,</text><text x="92" y="289" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >05</text><text x="156" y="289" fill="#168D7D" font-size="18" font-weight="400" class="mono" >  position: &quot;Co-Founder&quot;,</text><text x="92" y="314" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >06</text><text x="156" y="314" fill="#168D7D" font-size="18" font-weight="400" class="mono" >  philosophy: &quot;build, learn, improve&quot;,</text><text x="92" y="339" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >07</text><text x="156" y="339" fill="#567277" font-size="18" font-weight="400" class="mono" >  focus: [&quot;AI&quot;, &quot;software&quot;, &quot;connected systems&quot;]</text><text x="92" y="364" fill="#91A5A4" font-size="15" font-weight="400" class="mono" >08</text><text x="156" y="364" fill="#172B30" font-size="18" font-weight="400" class="mono" >};</text><path d="M705 168L1134 168" stroke="#C5D6D2"/><rect x="767" y="201" width="310" height="164" rx="12" fill="#E1F2E9" stroke="#C5D6D2"/><text x="794" y="231" fill="#567277" font-size="14" font-weight="700" class="mono" >// CURRENT STATUS</text><circle cx="805" cy="272" r="7" fill="#168D7D" class="pulse"/><text x="828" y="279" fill="#172B30" font-size="24" font-weight="700" class="mono" >BUILD MODE</text><text x="797" y="324" fill="#567277" font-size="14" font-weight="400" class="mono" >thinking  →  building  →  iterating</text><rect x="1090" y="399" width="11" height="20" fill="#168D7D" class="blink"/></g></svg>