<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" width="1200" height="468" role="img" aria-label="Animated real engineering mission terminal and project principles"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#F7F5EF"/><stop offset="1" stop-color="#EAF0EC"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.b{animation:beacon 3s ease-in-out infinite}.b2{animation:beacon 3s ease-in-out 1.5s infinite}.rot{animation:rotation 26s linear infinite;transform-box:fill-box;transform-origin:center}.trail{stroke-dasharray:9 15;animation:flow 7s linear infinite}.blink{animation:beacon 1.6s step-end infinite}.sweep{animation:sweep 5s ease-in-out infinite alternate}.reveal{stroke-dasharray:500;stroke-dashoffset:500;animation:reveal 2.7s ease-out forwards}@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes rotation{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes sweep{to{transform:translateX(210px)}}@keyframes reveal{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.b,.b2,.rot,.trail,.blink,.sweep,.reveal{animation:none!important}.reveal{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="466" rx="18" fill="url(#g)" stroke="#C8D7D1" stroke-width="2"/><rect x="48" y="39" width="1104" height="389" rx="16" fill="#FFFFFF" stroke="#C8D7D1" stroke-width="2"/><path d="M49 103H1151" stroke="#C8D7D1" stroke-width="2"/><circle cx="80" cy="73" r="8" fill="#AA6733"/><circle cx="108" cy="73" r="8" fill="#167E73"/><circle cx="136" cy="73" r="8" fill="#C8D7D1"/><text x="518" y="82" class="m" font-size="22" fill="#526766">~/munir/mission-console</text><text x="81" y="156" class="m" font-size="28" font-weight="700" fill="#167E73">$ whoami</text><text x="84" y="204" class="m" font-size="26" fill="#172529">Engineer. Founder. Builder.</text><text x="81" y="259" class="m" font-size="27" font-weight="700" fill="#167E73">$ cat principles.txt</text><text x="83" y="304" class="m" font-size="23" fill="#526766">01  Solve the real problem</text><text x="83" y="341" class="m" font-size="23" fill="#526766">02  Build for maintainability</text><text x="83" y="378" class="m" font-size="23" fill="#526766">03  Ship · Test · Improve</text><rect x="584" y="358" width="14" height="25" fill="#AA6733" class="blink"/><path d="M738 131V406" stroke="#C8D7D1" stroke-width="2"/><circle cx="966" cy="271" r="119" fill="none" stroke="#C8D7D1" stroke-width="2"/><circle cx="966" cy="271" r="88" fill="none" stroke="#167E73" stroke-dasharray="8 14" stroke-width="3" class="rot"/><circle cx="966" cy="271" r="57" fill="#E2F0EB" stroke="#167E73" stroke-width="2"/><text x="966" y="282" text-anchor="middle" class="m" font-size="28" font-weight="700" fill="#172529">SHIP</text><circle cx="966" cy="152" r="9" fill="#167E73" class="b"/><circle cx="1085" cy="271" r="9" fill="#AA6733" class="b2"/><circle cx="966" cy="390" r="9" fill="#167E73" class="b"/><circle cx="847" cy="271" r="9" fill="#AA6733" class="b2"/></svg>