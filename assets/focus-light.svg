<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 422" width="1200" height="422" role="img" aria-label="Animated four-node game skill tree for AI, software, cloud and connected engineering"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#F7F5EF"/><stop offset="1" stop-color="#EAF0EC"/></linearGradient></defs><style>.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace}.b{animation:beacon 3s ease-in-out infinite}.b2{animation:beacon 3s ease-in-out 1.5s infinite}.rot{animation:rotation 26s linear infinite;transform-box:fill-box;transform-origin:center}.trail{stroke-dasharray:9 15;animation:flow 7s linear infinite}.blink{animation:beacon 1.6s step-end infinite}.sweep{animation:sweep 5s ease-in-out infinite alternate}.reveal{stroke-dasharray:500;stroke-dashoffset:500;animation:reveal 2.7s ease-out forwards}@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes rotation{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes sweep{to{transform:translateX(210px)}}@keyframes reveal{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.b,.b2,.rot,.trail,.blink,.sweep,.reveal{animation:none!important}.reveal{stroke-dashoffset:0}}</style><rect x="1" y="1" width="1198" height="420" rx="18" fill="url(#g)" stroke="#C8D7D1" stroke-width="2"/><text x="46" y="53" class="m" font-size="22" fill="#167E73" letter-spacing="2">SKILL TREE / ACTIVE BRANCHES</text><text x="46" y="109" class="s" font-size="35" font-weight="800" fill="#172529">Four disciplines. One engineering mindset.</text><path d="M132 234H1080" fill="none" stroke="#C8D7D1" stroke-width="8"/><path d="M132 234H1080" fill="none" stroke="#167E73" stroke-width="3" class="trail"/><circle cx="132" cy="234" r="65" fill="#FFFFFF" stroke="#167E73" stroke-width="3"/><circle cx="132" cy="234" r="49" fill="#E2F0EB" stroke="#C8D7D1" stroke-width="2"/><text x="132" y="247" text-anchor="middle" class="m" font-size="33" font-weight="700" fill="#167E73">01</text><text x="132" y="350" text-anchor="middle" class="s" font-size="29" font-weight="800" fill="#172529">APPLIED AI</text><text x="132" y="385" text-anchor="middle" class="s" font-size="23" fill="#526766">Agents · LLMs</text><circle cx="448" cy="234" r="65" fill="#FFFFFF" stroke="#167E73" stroke-width="3"/><circle cx="448" cy="234" r="49" fill="#E2F0EB" stroke="#C8D7D1" stroke-width="2"/><text x="448" y="247" text-anchor="middle" class="m" font-size="33" font-weight="700" fill="#167E73">02</text><text x="448" y="350" text-anchor="middle" class="s" font-size="29" font-weight="800" fill="#172529">SOFTWARE</text><text x="448" y="385" text-anchor="middle" class="s" font-size="23" fill="#526766">Apps · APIs</text><circle cx="764" cy="234" r="65" fill="#FFFFFF" stroke="#167E73" stroke-width="3"/><circle cx="764" cy="234" r="49" fill="#E2F0EB" stroke="#C8D7D1" stroke-width="2"/><text x="764" y="247" text-anchor="middle" class="m" font-size="33" font-weight="700" fill="#167E73">03</text><text x="764" y="350" text-anchor="middle" class="s" font-size="29" font-weight="800" fill="#172529">CLOUD & OPS</text><text x="764" y="385" text-anchor="middle" class="s" font-size="23" fill="#526766">Deploy · Monitor</text><circle cx="1080" cy="234" r="65" fill="#FFFFFF" stroke="#167E73" stroke-width="3"/><circle cx="1080" cy="234" r="49" fill="#E2F0EB" stroke="#C8D7D1" stroke-width="2"/><text x="1080" y="247" text-anchor="middle" class="m" font-size="33" font-weight="700" fill="#167E73">04</text><text x="1080" y="350" text-anchor="middle" class="s" font-size="29" font-weight="800" fill="#172529">CONNECTED</text><text x="1080" y="385" text-anchor="middle" class="s" font-size="23" fill="#526766">ESP32 · IoT</text></svg>