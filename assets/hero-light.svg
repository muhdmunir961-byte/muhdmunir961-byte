<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
<title id="t">Munir — developer and automotive technology student</title>
<desc id="d">Minimal editorial-style animated GitHub profile banner with subtle orange orbit and moving signal dots.</desc>
<defs>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF7F1"/><stop offset="1" stop-color="#F0ECE3"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B95F3B" stop-opacity=".95"/><stop offset="1" stop-color="#B95F3B" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="378" rx="20"/></clipPath>
</defs>
<style>
  .serif{font-family:Georgia, 'Times New Roman',serif}
  .sans{font-family:Arial,Helvetica,sans-serif}
  .orbit{transform-origin:950px 190px;animation:spin 32s linear infinite}
  .pulse{animation:pulse 3.7s ease-in-out infinite}
  .travel{animation:trace 7s linear infinite}
  .travel2{animation:trace 7s linear infinite 2.6s}
  .line{stroke-dasharray:190;stroke-dashoffset:190;animation:draw 2s ease-out both}
  .cursor{animation:blink 1.4s step-end infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes trace{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.orbit,.pulse,.travel,.travel2,.line,.cursor{animation:none!important}.line{stroke-dashoffset:0}}
</style>
<rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="20" fill="url(#wash)" stroke="#D9D5CB" stroke-width="1.5"/>
<g clip-path="url(#clip)">
  <g opacity=".48" stroke="#DEDAD1" stroke-width=".8">
     <path d="M728 0V380 M794 0V380 M860 0V380 M926 0V380 M992 0V380 M1058 0V380 M1124 0V380"/>
     <path d="M700 44H1200 M700 110H1200 M700 176H1200 M700 242H1200 M700 308H1200"/>
  </g>
  <path d="M720 309H1200" stroke="#D9D5CB" stroke-width="1"/>
  <g fill="none" stroke="#D9D5CB" stroke-width="1.2">
   <circle cx="950" cy="190" r="158"/><circle cx="950" cy="190" r="116"/><circle cx="950" cy="190" r="72"/>
   <path d="M950 22V358 M782 190H1118" opacity=".7"/>
  </g>
  <g class="orbit">
    <circle cx="950" cy="32" r="5.5" fill="#B95F3B"/><circle cx="950" cy="32" r="13" fill="none" stroke="#B95F3B" stroke-opacity=".42"/>
    <path d="M950 28L950 14" stroke="#B95F3B" stroke-width="2"/>
  </g>
  <circle cx="950" cy="190" r="43" fill="#B95F3B" fill-opacity=".08" stroke="#B95F3B" stroke-opacity=".52"/>
  <circle cx="950" cy="190" r="11" fill="#B95F3B" class="pulse"/>
  <circle cx="950" cy="190" r="2.5" fill="#FAF7F1"/>
  <path d="M746 320 Q838 260 908 330 T1080 308" fill="none" stroke="#B95F3B" stroke-opacity=".75" stroke-width="1.3"/>
  <path id="path" d="M746 320 Q838 260 908 330 T1080 308" fill="none" stroke="none"/>
  <circle r="4.5" fill="#B95F3B" style="offset-path:path('M746 320 Q838 260 908 330 T1080 308')" class="travel"/>
  <circle r="2.5" fill="#B95F3B" style="offset-path:path('M746 320 Q838 260 908 330 T1080 308')" class="travel2"/>
  <rect x="61" y="46" width="9" height="9" rx="2" fill="#B95F3B"/>
  <text class="sans" x="84" y="55" font-size="14" font-weight="700" letter-spacing="4" fill="#666965">MUNIR / 01</text>
  <path d="M61 82H655" stroke="#D9D5CB"/>
  <text class="serif" x="60" y="169" font-size="82" font-weight="400" letter-spacing="-3" fill="#222727">Muhd Munir<tspan fill="#B95F3B">.</tspan></text>
  <text class="sans" x="64" y="208" font-size="18.5" font-weight="500" fill="#222727" letter-spacing=".65">Developer <tspan fill="#B95F3B">/</tspan> Automotive technology <tspan fill="#B95F3B">/</tspan> Product-minded</text>
  <text class="sans" x="64" y="251" font-size="18" fill="#666965">Building thoughtful interfaces and connected systems.</text>
  <path class="line" d="M64 282H254" fill="none" stroke="url(#fade)" stroke-width="3" stroke-linecap="round"/>
  <text class="sans" x="64" y="332" font-size="12" letter-spacing="3.1" fill="#666965">ENGINEERING IDEAS INTO EXPERIENCES</text>
  <rect class="cursor" x="597" y="317" width="8" height="15" fill="#B95F3B"/>
  <text class="sans" x="1062" y="347" fill="#666965" font-size="11" letter-spacing="1.5">MY / 2026</text>
</g>
</svg>